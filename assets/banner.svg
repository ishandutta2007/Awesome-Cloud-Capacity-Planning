<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".2"/><stop offset="50%" stop-color="#6366f1" stop-opacity=".8"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}@keyframes heightPulse{0%{transform:scaleY(.7)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#titleGrad)}.subtitle{font-weight:400;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.dash-line{stroke-dasharray:8 8;animation:dash 20s linear infinite}.wave-bar{animation:heightPulse 2.5s infinite ease-in-out alternate}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g opacity=".25"><path fill="none" stroke="#38bdf8" stroke-width="3" d="M 50,320 Q 200,180 400,260 T 750,200 T 1150,280" class="dash-line"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 50,340 Q 250,220 500,290 T 900,170 T 1150,240" class="dash-line"/><g stroke="none" transform="translate(850, 260)"><rect width="12" height="100" x="0" y="-80" fill="#38bdf8" class="wave-bar" rx="4" style="transform-origin:bottom"/><rect width="12" height="140" x="20" y="-120" fill="#6366f1" class="wave-bar" rx="4" style="animation-delay:.4s;transform-origin:bottom"/><rect width="12" height="80" x="40" y="-60" fill="#a855f7" class="wave-bar" rx="4" style="animation-delay:.8s;transform-origin:bottom"/><rect width="12" height="160" x="60" y="-140" fill="#38bdf8" class="wave-bar" rx="4" style="animation-delay:.2s;transform-origin:bottom"/><rect width="12" height="110" x="80" y="-90" fill="#818cf8" class="wave-bar" rx="4" style="animation-delay:.6s;transform-origin:bottom"/></g></g><circle cx="150" cy="100" r="100" fill="#0284c7" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="300" r="120" fill="#7e22ce" filter="url(#glow)" opacity=".15"/><g transform="translate(80, 140)"><g transform="translate(0, -60)"><rect width="250" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><circle cx="20" cy="16" r="5" fill="#10b981"/><text x="35" y="21" class="badge-text">CLOUD FINOPS &amp; CAPACITY</text></g><text x="0" y="20" class="title" filter="url(#glow)">Awesome Cloud Capacity Planning</text><text x="0" y="65" class="subtitle">Curated SaaS Platforms, Open-Source Tools &amp; Infrastructure Optimization Ecosystem</text><rect width="600" height="3" x="0" y="95" fill="url(#lineGrad)" rx="1.5"/><g transform="translate(0, 125)"><rect width="150" height="28" fill="#0f172a" stroke="#0284c7" stroke-width="1" rx="6"/><text x="15" y="19" fill="#7dd3fc" font-family="sans-serif" font-size="12">⚡ Rightsizing</text><rect width="160" height="28" x="165" fill="#0f172a" stroke="#6366f1" stroke-width="1" rx="6"/><text x="180" y="19" fill="#a5b4fc" font-family="sans-serif" font-size="12">📊 Cost Allocation</text><rect width="170" height="28" x="340" fill="#0f172a" stroke="#a855f7" stroke-width="1" rx="6"/><text x="355" y="19" fill="#f0abfc" font-family="sans-serif" font-size="12">⚙️ K8s Autoscaling</text></g></g></svg>