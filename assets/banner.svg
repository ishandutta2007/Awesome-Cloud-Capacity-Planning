<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    .dash-line {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    .wave-bar {
      animation: heightPulse 2.5s infinite ease-in-out alternate;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes heightPulse {
      0% { transform: scaleY(0.7); }
      100% { transform: scaleY(1.1); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic / Animated Background Wave Charts (Behind text) -->
  <g opacity="0.25">
    <path class="dash-line" d="M 50,320 Q 200,180 400,260 T 750,200 T 1150,280" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path class="dash-line" d="M 50,340 Q 250,220 500,290 T 900,170 T 1150,240" fill="none" stroke="#818cf8" stroke-width="2" />
    
    <!-- Animated Bar Graph Elements in background -->
    <g stroke="none" transform="translate(850, 260)">
      <rect class="wave-bar" x="0" y="-80" width="12" height="100" rx="4" fill="#38bdf8" style="transform-origin: bottom;" />
      <rect class="wave-bar" x="20" y="-120" width="12" height="140" rx="4" fill="#6366f1" style="animation-delay: 0.4s; transform-origin: bottom;" />
      <rect class="wave-bar" x="40" y="-60" width="12" height="80" rx="4" fill="#a855f7" style="animation-delay: 0.8s; transform-origin: bottom;" />
      <rect class="wave-bar" x="60" y="-140" width="12" height="160" rx="4" fill="#38bdf8" style="animation-delay: 0.2s; transform-origin: bottom;" />
      <rect class="wave-bar" x="80" y="-90" width="12" height="110" rx="4" fill="#818cf8" style="animation-delay: 0.6s; transform-origin: bottom;" />
    </g>
  </g>

  <!-- Glowing background nodes -->
  <circle cx="150" cy="100" r="100" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="300" r="120" fill="#7e22ce" opacity="0.15" filter="url(#glow)" />

  <!-- Foreground Content: Title & Subtitle (Clear and Visible) -->
  <g transform="translate(80, 140)">
    <!-- Category Pill -->
    <g transform="translate(0, -60)">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="16" r="5" fill="#10b981" />
      <text x="35" y="21" class="badge-text">CLOUD FINOPS &amp; CAPACITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="20" class="title" filter="url(#glow)">Awesome Cloud Capacity Planning</text>
    
    <!-- Subtitle -->
    <text x="0" y="65" class="subtitle">Curated SaaS Platforms, Open-Source Tools &amp; Infrastructure Optimization Ecosystem</text>
    
    <!-- Decorative Line -->
    <rect x="0" y="95" width="600" height="3" rx="1.5" fill="url(#lineGrad)" />

    <!-- Feature Pills -->
    <g transform="translate(0, 125)">
      <rect width="150" height="28" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="15" y="19" font-family="sans-serif" font-size="12" fill="#7dd3fc">⚡ Rightsizing</text>

      <rect x="165" width="160" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <text x="180" y="19" font-family="sans-serif" font-size="12" fill="#a5b4fc">📊 Cost Allocation</text>

      <rect x="340" width="170" height="28" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <text x="355" y="19" font-family="sans-serif" font-size="12" fill="#f0abfc">⚙️ K8s Autoscaling</text>
    </g>
  </g>
</svg>
